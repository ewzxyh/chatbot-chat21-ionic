<div *ngIf="isVideo; else embeddedFrame" class="video-container">
  <div *ngIf="hasError" class="media-error">
    <span>Prévia indisponível</span>
    <button type="button" (click)="retryLoad()">Tentar novamente</button>
  </div>
  <video *ngIf="!hasError"
    #videoElement
    class="message-video"
    controls
    playsinline
    preload="metadata"
    [src]="mediaUrl"
    (loadedmetadata)="onLoaded($event)"
    (error)="onError()">
  </video>
</div>

<ng-template #embeddedFrame>
<div [ngStyle] = "{ 'max-width': '100%', 'width': width, 'height': height }">
  <div *ngIf="loading" class="loader" [ngStyle] = "{ 'width': width , 'height': height  }"></div>
  <div *ngIf="hasError" class="media-error" [ngStyle] = "{ 'width': width , 'min-height': height  }">
    <span>Prévia indisponível</span>
    <button type="button" (click)="retryLoad()">Tentar novamente</button>
  </div>
  <iframe  allowfullscreen 
    [ngClass]="{'isLoadingImage': loading || hasError}"
    width = "100%" height = "100%" 
    [src]="url" 
    (load)="onLoaded($event)"
    (error)="onError()">
  </iframe>
</div>
</ng-template>
