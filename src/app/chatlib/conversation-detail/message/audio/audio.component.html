<div class="audio-container" [class.is-loading]="isLoading" [class.has-error]="hasError">
  <audio
    #audioElement
    [src]="audioUrl"
    preload="metadata"
    (loadedmetadata)="onLoadedMetadata()"
    (timeupdate)="onTimeUpdate()"
    (ended)="onAudioEnded()"
    (error)="onAudioError()">
  </audio>

  <ng-container *ngIf="!hasError; else audioError">
    <button class="play-pause" type="button" (click)="playPauseAudio()" [disabled]="isLoading" [attr.aria-label]="isPlaying ? 'Pausar áudio' : 'Reproduzir áudio'">
      <svg *ngIf="!isPlaying" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
        <path d="M320-200v-560l440 280-440 280Z"/>
      </svg>
      <svg *ngIf="isPlaying" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
        <path d="M560-200v-560h160v560H560Zm-320 0v-560h160v560H240Z"/>
      </svg>
    </button>

    <div class="audio-main">
      <div class="audio-row">
        <input
          class="audio-seek"
          type="range"
          min="0"
          max="100"
          step="0.1"
          [value]="seekValue"
          [disabled]="isLoading || !audioDuration"
          (input)="seekAudio($event)"
          [style.--seek-before-width]="seekValue + '%'" />
        <span class="audio-time" [style.color]="color" [style.font-size]="fontSize">
          {{ formatTime(currentTime) }}
        </span>
      </div>
      <div class="audio-meta">
        <span>Áudio</span>
        <span>{{ formatTime(audioDuration) }}</span>
      </div>
    </div>
  </ng-container>

  <ng-template #audioError>
    <div class="audio-error">
      <span>Áudio indisponível</span>
      <button type="button" (click)="retryLoad()">Tentar novamente</button>
    </div>
  </ng-template>
</div>
